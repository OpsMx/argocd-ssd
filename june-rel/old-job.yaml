apiVersion: batch/v1
kind: Job
metadata:
  name: upgrade-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        batch.kubernetes.io/job-name: upgrade-job
        job-name: upgrade-job
    spec:
      containers:
      - env:
        - name: S3_ENDPOINT_URL
          value: http://ssd-minio:9000
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ssd-minio
              key: accesskey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ssd-minio
              key: secretkey
        image: opsmx11/upgrade-script:18586b8-8
        imagePullPolicy: IfNotPresent
        name: upgrade-job
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: upgrade-job-volume
          mountPath: /app/config/upgrade-job.yaml
          subPath: upgrade-job.yaml
        - name: token
          readOnly: true
          mountPath: /app/secrets/prod-token/ #FOR PROD IF FOR 2nd dgraph as well mount `exp-token` too 
      restartPolicy: Never
      volumes:
      - name: token
        secret:
          secretName: ssd-opa-token
          defaultMode: 420
      - name: upgrade-job-volume
        configMap:
          name: upgrade-job
          items:
            - key: upgrade-job.yaml
              path: upgrade-job.yaml
          defaultMode: 420
      - name: scanresult
